<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minutara recorder</title>
<script>
  (function () {
    var pref = "system";
    try { pref = localStorage.getItem("minutara-theme") || localStorage.getItem("scribe-theme") || "system"; } catch (e) {}
    var dark = pref === "dark" || (pref === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<style>
  :root {
    --bg: #2e2e2b; --text: #ecebe6; --dim: #a3a097; --edge: #46463f;
    --btn: #3a3a36; --btn-hi: #45453f; --primary: #ecebe6; --primary-text: #1d1c19;
    --rec: #e8933a; --accent: #b5c75a;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="light"] {
    --bg: #f6f5f1; --text: #1d1c19; --dim: #6a675f; --edge: #dedbd2;
    --btn: #ebe9e2; --btn-hi: #e1ded5; --primary: #1d1c19; --primary-text: #ffffff;
    --rec: #c26e1c; --accent: #6c7d20;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.3 var(--sans); user-select: none; -webkit-user-select: none; cursor: default; }
  /* The background is the drag handle; everything on top lets clicks fall
     through to it except the buttons. */
  .bg { position: fixed; inset: 0; z-index: 0; border: 1px solid var(--edge); border-radius: 12px; }
  .face { position: fixed; inset: 0; z-index: 1; pointer-events: none; display: none; }
  .face button { pointer-events: auto; }
  body[data-mode="prompt"] #prompt,
  body[data-mode="ended"] #ended { display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 7px; padding: 12px 14px; text-align: center; }
  body[data-mode="recording"] #recording { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px; }

  .logo { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    background: color-mix(in srgb, var(--rec) 18%, transparent); }
  .logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); }
  .t1 { font-size: 12px; color: var(--dim); }
  .t2 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .b { width: 100%; height: 30px; border: 0; border-radius: 999px; font: 600 13px var(--sans);
    background: var(--btn); color: var(--text); cursor: pointer; }
  .b:hover { background: var(--btn-hi); }
  .b.primary { background: var(--primary); color: var(--primary-text); }
  .b.primary:hover { opacity: .9; }

  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); flex: none;
    animation: pulse 1.6s ease-in-out infinite; }
  body.paused .dot { animation: none; opacity: .45; }
  @keyframes pulse { 50% { opacity: .35; } }
  .time { font: 600 15px var(--sans); font-variant-numeric: tabular-nums; min-width: 46px; }
  .lbl { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ib { width: 30px; height: 30px; flex: none; border: 0; border-radius: 8px; background: transparent;
    color: var(--text); display: grid; place-items: center; cursor: pointer; }
  .ib:hover { background: var(--btn); }
  .ib.stop { color: var(--rec); }
  .ib svg { width: 17px; height: 17px; }
  .ib:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body data-mode="">
<div class="bg pywebview-drag-region"></div>

<section class="face" id="prompt">
  <div class="logo"><i></i></div>
  <div class="t1" id="p-app">Meeting detected</div>
  <div class="t2">Take notes?</div>
  <button class="b primary" id="p-start">Start</button>
  <button class="b" id="p-skip">Not now</button>
</section>

<section class="face" id="recording">
  <span class="dot"></span>
  <span class="time" id="r-time">0:00</span>
  <span class="lbl" id="r-lbl">Recording</span>
  <button class="ib" id="r-pause" title="Pause"></button>
  <button class="ib stop" id="r-stop" title="Stop and save">
    <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg></button>
  <button class="ib" id="r-open" title="Open Minutara">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5h5.5V10M19.5 4.5 11 13M17 13.5v4a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4"/></svg></button>
  <button class="ib" id="r-hide" title="Hide until this recording ends">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
</section>

<section class="face" id="ended">
  <div class="t1" id="e-app">The call ended</div>
  <div class="t2">Stop recording?</div>
  <button class="b primary" id="e-stop">Stop recording</button>
  <button class="b" id="e-keep">Keep recording</button>
</section>

<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const $ = s => document.querySelector(s);
  const PAUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6v12M15 6v12"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>';
  let S = {}, seen = "";

  async function api(path, body) {
    const r = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "X-Token": token, "X-Minutara-Widget": "1", "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    return r.json().catch(() => ({}));
  }

  function clock(s) {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`;
  }

  // window.py calls this just before showing the window, so it never shows
  // the previous face for a moment.
  window.minutaraMode = mode => { document.body.dataset.mode = mode; render(); };

  function render() {
    const mode = document.body.dataset.mode;
    const w = S.widget || {}, m = S.meeting || {};
    const app = w.app || m.app || m.ended || "";
    $("#p-app").textContent = app ? `${app} meeting${m.preview ? " (preview)" : ""}` : "Meeting detected";
    $("#e-app").textContent = app ? `${app} call ended` : "The call ended";
    const paused = S.state === "paused", saving = S.state === "saving";
    document.body.classList.toggle("paused", paused);
    $("#r-time").textContent = clock(S.elapsed);
    $("#r-lbl").textContent = w.preview_face ? "Preview: this is the floating recorder"
      : saving ? "Saving…" : paused ? "Paused" : (S.title || "Recording");
    $("#r-pause").innerHTML = paused ? PLAY : PAUSE;
    $("#r-pause").title = paused ? "Resume" : "Pause";
    $("#r-pause").disabled = $("#r-stop").disabled = saving;
    if (mode && mode !== seen) { seen = mode; api("/api/widget/seen", { mode }); }
  }

  async function poll() {
    try {
      S = await api("/api/status");
      const mode = (S.widget && S.widget.mode) || "";
      if (mode) document.body.dataset.mode = mode;
      render();
    } catch {}
  }
  setInterval(poll, 500);
  poll();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  const theme = () => {
    let pref = "system";
    try { pref = localStorage.getItem("minutara-theme") || localStorage.getItem("scribe-theme") || "system"; } catch {}
    const dark = pref === "dark" || (pref === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  };
  addEventListener("storage", theme);   // follows the main window's theme switch

  $("#p-start").onclick = () => {
    const m = S.meeting || {}, app = m.app || "";
    api("/api/start", { title: app ? `${app} meeting` : "", meeting_app: m.preview ? "" : app });
  };
  $("#p-skip").onclick = () => api("/api/meeting/dismiss", {});
  $("#r-pause").onclick = () => api(S.state === "paused" ? "/api/resume" : "/api/pause", {});
  $("#r-stop").onclick = () => api("/api/stop", {});
  $("#r-open").onclick = () => api("/api/show", {});
  $("#r-hide").onclick = () => api("/api/widget/hide", {});
  $("#e-stop").onclick = () => api("/api/stop", {});
  $("#e-keep").onclick = () => api("/api/meeting/keep", {});
</script>
</body>
</html>
