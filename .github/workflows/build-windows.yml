# Builds Minutara.exe on Windows, tests the packaged app, and (on main) publishes
# Minutara-windows.zip as a GitHub Release. Pull requests get the zip as a
# downloadable build artifact instead.
name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publishing releases from main

jobs:
  # The test suites, with the audio hardware, Whisper and cloud services faked.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy flask requests qrcode anthropic openai playwright
          python -m playwright install --with-deps chromium
      - name: Run the tests
        run: python tests/run_all.py

  build:
    needs: tests     # no release unless the tests pass
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64     # the speech libraries are x64-only; ARM PCs run it under emulation
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Stamp the version
        run: |
          # Releases (pushes to main) are 1.0.<run>; other builds say so.
          $v = "1.0.${{ github.run_number }}"
          if ("${{ github.event_name }}" -ne "push" -or "${{ github.ref }}" -ne "refs/heads/main") { $v = "$v-test" }
          Set-Content -Path minutara\version.py -Value "VERSION = `"$v`"" -Encoding utf8
          Write-Host "version $v"
          "MINUTARA_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Minutara.exe
        run: |
          python build\make_icon.py
          python -m PyInstaller build\minutara.spec --noconfirm --clean
          Copy-Item README.md, LICENSE -Destination dist\Minutara
          Copy-Item build\exe.config dist\Minutara\Minutara.exe.config
          Copy-Item build\exe.config dist\Minutara\minutara-cli.exe.config

      - name: Zip
        run: 7z a -tzip -mx=5 Minutara-windows.zip .\dist\Minutara | Select-Object -Last 3

      # Test the zip exactly as a user gets it: unzip, then run from there.
      - name: Test the packaged app
        env:
          MINUTARA_WHISPER_MODEL: tiny.en
        run: |
          7z x Minutara-windows.zip -osmoke | Select-Object -Last 2
          Set-Location smoke\Minutara

          # Mark every file as downloaded from the internet, as Windows does
          # when a downloaded zip is extracted without "Unblock" first.
          Get-ChildItem -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          Write-Host "marked $((Get-ChildItem -Recurse -File).Count) files as downloaded"
          # (The two .exe files are left unmarked: a marked .exe started from a
          # script can stop at a security prompt. You click past it at home.)
          Get-ChildItem *.exe | ForEach-Object { Remove-Item -LiteralPath $_.FullName -Stream Zone.Identifier }

          # For the record: with neither fix, does the mark break the window library?
          Rename-Item Minutara.exe.config Minutara.exe.config.off
          Rename-Item minutara-cli.exe.config minutara-cli.exe.config.off
          $env:MINUTARA_NO_UNBLOCK = "1"
          Write-Host "without the fixes: $(.\minutara-cli.exe doctor | Select-String 'app window')"
          Remove-Item Env:MINUTARA_NO_UNBLOCK
          Rename-Item Minutara.exe.config.off Minutara.exe.config
          Rename-Item minutara-cli.exe.config.off minutara-cli.exe.config

          .\minutara-cli.exe doctor --transcribe
          if ($LASTEXITCODE -ne 0) { throw "doctor reported a failure" }

          $cli = Start-Process .\minutara-cli.exe -ArgumentList "serve", "--port", "8790" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 20
          $token = (Get-Content config.json | ConvertFrom-Json).server_token
          $status = Invoke-RestMethod "http://127.0.0.1:8790/api/status?token=$token"
          if ($status.state -ne "idle") { throw "unexpected state: $($status.state)" }
          if ($status.version -ne $env:MINUTARA_VERSION) { throw "app reports version '$($status.version)', expected '$env:MINUTARA_VERSION'" }
          $page = Invoke-WebRequest "http://127.0.0.1:8790/" -UseBasicParsing
          if ($page.Content -notmatch "/static/app.js") { throw "app page missing" }
          $devices = Invoke-RestMethod "http://127.0.0.1:8790/api/devices?token=$token"
          if ("$($devices.error)" -match "No module named") { throw "recording library missing: $($devices.error)" }
          $zip = Invoke-WebRequest "http://127.0.0.1:8790/api/export?token=$token" -UseBasicParsing
          if ("$($zip.Headers['Content-Type'])" -notmatch "zip") { throw "Export all didn't return a zip: $($zip.Headers['Content-Type'])" }
          Stop-Process -Id $cli.Id -Force

          # The windowless Minutara.exe must start too.
          $app = Start-Process .\Minutara.exe -ArgumentList "serve", "--port", "8791" -PassThru
          Start-Sleep -Seconds 20
          $status2 = Invoke-RestMethod "http://127.0.0.1:8791/api/status?token=$token"
          if ($status2.state -ne "idle") { throw "Minutara.exe did not start" }
          Stop-Process -Id $app.Id -Force

          # Double-clicked (no arguments), Minutara.exe opens its own window,
          # so the taskbar and a pinned icon show Minutara, not Edge.
          $port = (Get-Content config.json | ConvertFrom-Json).server_port
          $win = Start-Process .\Minutara.exe -PassThru
          $title = ""
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline -and $title -ne "Minutara") {
            Start-Sleep -Seconds 2
            $win.Refresh()
            $title = $win.MainWindowTitle
          }
          Write-Host "window title: '$title'"
          if ($title -ne "Minutara") { throw "Minutara.exe didn't open its own window" }
          # Opening it again hands over to the running app and exits.
          $again = Start-Process .\Minutara.exe -PassThru
          if (-not $again.WaitForExit(20000)) { throw "a second launch didn't hand over to the running app" }
          $shown = Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/show?token=$token"
          if (-not $shown.shown) { throw "the running window couldn't be brought to the front" }

          # The floating window: preview the meeting pop-up and check it drew itself.
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/meeting/preview?token=$token" | Out-Null
          $fw = $null
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
            $fw = (Invoke-RestMethod "http://127.0.0.1:$port/api/status?token=$token").widget
            if ($fw.mode -eq "prompt" -and $fw.page_mode -eq "prompt") { break }
          }
          Write-Host "floating window: $($fw | ConvertTo-Json -Compress)"
          if ($fw.mode -ne "prompt" -or $fw.page_mode -ne "prompt") { throw "the floating window didn't show the meeting pop-up" }
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/meeting/dismiss?token=$token" | Out-Null

          # Meeting detection, through the real registry and real windows:
          # pretend Zoom, then Teams in Edge, take the microphone.
          $micKey = "Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone\NonPackaged"
          function Set-MicUse($exe, $inUse) {
            $k = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey("$micKey\$($exe.Replace('\', '#'))")
            $k.SetValue("LastUsedTimeStart", [long]1, [Microsoft.Win32.RegistryValueKind]::QWord)
            $k.SetValue("LastUsedTimeStop", [long]$(if ($inUse) { 0 } else { 2 }), [Microsoft.Win32.RegistryValueKind]::QWord)
            $k.Close()
          }
          function Wait-Meeting($want) {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Seconds 1
              $m = (Invoke-RestMethod "http://127.0.0.1:$port/api/status?token=$token").meeting
            } while ((Get-Date) -lt $deadline -and $m.app -ne $want)
            Write-Host "meeting: '$($m.app)' (wanted '$want')"
            if ($m.app -ne $want) { throw "meeting detection: expected '$want', got '$($m.app)'" }
          }
          $zoom = "C:\Users\runner\AppData\Roaming\Zoom\bin\Zoom.exe"
          Set-MicUse $zoom $true
          Wait-Meeting "Zoom"
          Set-MicUse $zoom $false
          Wait-Meeting ""

          $edgeExe = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          $edge = Start-Process $edgeExe -PassThru -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\edge-meet", "--no-first-run", "--app=data:text/html,<title>Standup%20%7C%20Microsoft%20Teams</title>"
          Start-Sleep -Seconds 5
          Set-MicUse $edgeExe $true
          Wait-Meeting "Teams"
          Set-MicUse $edgeExe $false
          Wait-Meeting ""
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Content minutara.log | Select-String "microphone in use|meeting detected|meeting ended" | Select-Object -Last 8

          # The floating recorder: show its recording face (Settings' preview)
          # and ask Windows whether the window is really on screen.
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public static class Win32 {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          }
          "@
          Start-Sleep -Seconds 3
          Invoke-RestMethod -Method Post "http://127.0.0.1:$port/api/widget/preview?token=$token" -ContentType "application/json" -Body '{"face":"recording"}' | Out-Null
          $deadline = (Get-Date).AddSeconds(10)
          do {
            Start-Sleep -Milliseconds 500
            $fw = (Invoke-RestMethod "http://127.0.0.1:$port/api/status?token=$token").widget
            # ([NullString]::Value, not $null: PowerShell turns $null into "" for a string parameter)
            $visible = [Win32]::IsWindowVisible([Win32]::FindWindow([NullString]::Value, "Minutara recorder"))
          } while ((Get-Date) -lt $deadline -and -not ($visible -and $fw.page_mode -eq "recording"))
          Write-Host "floating recorder: visible=$visible $($fw | ConvertTo-Json -Compress -Depth 4)"
          Get-Content minutara.log | Select-String "floating window" | Select-Object -Last 12
          if (-not $visible -or $fw.page_mode -ne "recording") { throw "the floating recorder didn't appear" }

          # Closing the main window quits Minutara (the hidden floating window
          # mustn't keep it running).
          $win.CloseMainWindow() | Out-Null
          if (-not $win.WaitForExit(45000)) { throw "closing the window didn't quit Minutara" }

          Write-Host "--- minutara.log (tail)"
          Get-Content minutara.log -Tail 25

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Minutara-windows
          path: Minutara-windows.zip
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "1.0.${{ github.run_number }}"
          gh release create "v$version" Minutara-windows.zip `
            --title "Minutara $version" --notes-file build\release-notes.md --latest
