name: Idea or feature request
description: Suggest something Minutara could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Other apps that do this well, screenshots, workarounds you use today.
